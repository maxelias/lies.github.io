      <button class="modal-close-btn" id="licence-close">Close</button>
    </div>
  </div>
</div>

      <img src="https://file.garden/aeSpG6iUoRzyQ8ca/Untitled-3%20(3).png" alt="Conditions">

</div>
<script>
  const GIF_SRC = "https://file.garden/aeSpG6iUoRzyQ8ca/Untitled%20(11).gif";
  const FOOTER_IMAGES = {
    2: "https://file.garden/aeSpG6iUoRzyQ8ca/page2footer.png",
    3: "https://file.garden/aeSpG6iUoRzyQ8ca/Untitled%20design%20(8).jpg",
    4: "https://file.garden/aeSpG6iUoRzyQ8ca/Untitled%20design%20(6).jpg",
  };
  const p1 = document.getElementById("page1");
  const p2 = document.getElementById("page2");
  const p3 = document.getElementById("page3");
  const p4 = document.getElementById("page4");
  const p5 = document.getElementById("page5");
  const h1wrap = document.getElementById("h1-wrap");
  const h2wrap = document.getElementById("h2-wrap");
  const h3wrap = document.getElementById("h3-wrap");
  const f2wrap = document.getElementById("f-wrap");
  const p1TopBar = document.getElementById("p1-top-bar");
  const spinner = document.getElementById("spinner");
  const html = document.documentElement;
  const popupOverlay = document.getElementById("popup-overlay");
  const popupSheet = document.getElementById("popup-sheet");
  const mainGif = document.getElementById("main-gif");
  const privacyCover = document.getElementById("privacy-cover");
  const RELOAD_THRESHOLD = 190;
  const START_THRESHOLD = 40;
  const SPINNER_GAP = 24;

  let coverTimer = null;
  function showCover() { privacyCover.style.display = "block"; }
  function hideCover() { clearTimeout(coverTimer); privacyCover.style.display = "none"; }
  window.addEventListener("blur", () => { coverTimer = setTimeout(showCover, 80); });
  window.addEventListener("focus", hideCover);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { showCover(); } else { hideCover(); }
  });
  window.addEventListener("pagehide", showCover);
  window.addEventListener("pageshow", hideCover);

  function openPopup() {
    popupOverlay.style.display = "block";
    popupOverlay.getBoundingClientRect();
    popupOverlay.classList.add("open");
    popupSheet.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closePopup() {
    popupOverlay.classList.remove("open");
    popupSheet.classList.remove("open");
    document.body.style.overflow = "";
    popupOverlay.addEventListener("transitionend", function h() {
      if (!popupOverlay.classList.contains("open")) popupOverlay.style.display = "none";
      popupOverlay.removeEventListener("transitionend", h);
    });
  }
  popupOverlay.addEventListener("touchend", e => { e.preventDefault(); closePopup(); }, { passive: false });
  popupOverlay.addEventListener("click", closePopup);
  let sheetStartY = 0;
  popupSheet.addEventListener("touchstart", e => { sheetStartY = e.touches[0].clientY; }, { passive: true });
  popupSheet.addEventListener("touchend", e => { if (e.changedTouches[0].clientY - sheetStartY > 60) closePopup(); }, { passive: true });

  function openModal(id) {
    const el = document.getElementById(id);
    el.style.display = "flex";
    el.getBoundingClientRect();
    el.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeModal(id) {
    const el = document.getElementById(id);
    el.classList.remove("open");
    document.body.style.overflow = "";
    setTimeout(() => { if (!el.classList.contains("open")) el.style.display = "none"; }, 300);
  }
  ["licence-modal", "conditions-modal"].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener("click", e => { if (e.target === el) closeModal(id); });
    el.addEventListener("touchend", e => { if (e.target === el) { e.preventDefault(); closeModal(id); } }, { passive: false });
  });
  document.getElementById("licence-close").addEventListener("click", () => closeModal("licence-modal"));
  document.getElementById("licence-close").addEventListener("touchend", e => { e.preventDefault(); closeModal("licence-modal"); }, { passive: false });
  document.getElementById("conditions-close").addEventListener("click", () => closeModal("conditions-modal"));
  document.getElementById("conditions-close").addEventListener("touchend", e => { e.preventDefault(); closeModal("conditions-modal"); }, { passive: false });

  function addTapZone(id, fn) {
    const el = document.getElementById(id);
    let tDown = 0;
    el.addEventListener("touchstart", () => { tDown = Date.now(); }, { passive: true });
    el.addEventListener("touchend", e => { if (Date.now() - tDown < 300) { e.preventDefault(); fn(); } }, { passive: false });
    el.addEventListener("click", fn);
  }
  addTapZone("licence-tap-left", () => openModal("licence-modal"));
  addTapZone("licence-tap-right", () => openModal("conditions-modal"));

  function addZoneTap(id, fn) {
    const el = document.getElementById(id);
    let tDown = 0;
    el.addEventListener("touchstart", () => { tDown = Date.now(); }, { passive: true });
    el.addEventListener("touchend", e => { if (Date.now() - tDown < 300) { e.preventDefault(); fn(); } }, { passive: false });
    el.addEventListener("click", fn);
  }
  addZoneTap("header1-left", () => showPage(2));
  addZoneTap("header1-right", openPopup);

  const HOLD_OFFSET = 52;
  function fakeRefresh() {
    const activeContent = p1.classList.contains("active") ? document.getElementById("p1-content") : document.getElementById("p2-content");
    spinner.classList.add("spinning");
    setTimeout(() => {
      setRefreshText();
      requestAnimationFrame(() => {
        const pg = document.getElementById("pulse-group");
        if (pg) { pg.classList.remove("pulse"); void pg.offsetWidth; pg.classList.add("pulse"); }
      });
      const img = new Image();
      img.onload = () => { mainGif.src = GIF_SRC + (GIF_SRC.includes("?") ? "&" : "?") + "_=" + Date.now() % 100000; };
      img.src = GIF_SRC;
      activeContent.style.transition = "transform 0.35s cubic-bezier(0.32, 0.72, 0, 1)";
      activeContent.style.transform = "translateY(0)";
      spinner.classList.remove("spinning");
      spinner.style.transition = "opacity 0.4s";
      spinner.style.opacity = "0";
      setTimeout(() => { spinner.style.transition = ""; spinner.style.transform = "rotate(0deg)"; activeContent.style.transition = ""; }, 400);
    }, 750);
  }
  function currentPageNum() {
    if (p1.classList.contains("active")) return 1;
    if (p2.classList.contains("active")) return 2;
    if (p3.classList.contains("active")) return 3;
    if (p4.classList.contains("active")) return 4;
    return 5;
  }
  function setOffsets() {
    const n = currentPageNum();
    const header = n === 1 ? h1wrap : n === 2 ? h2wrap : n === 3 ? h3wrap : null;
    const topOff = n === 1 ? 10 : 0;
    const hHeight = (header ? header.offsetHeight : 0) + topOff;
    const fHeight = f2wrap.offsetHeight || 60;
    if (n === 1) {
      document.getElementById("p1-content").style.paddingTop = hHeight + "px";
      document.getElementById("p1-content").style.paddingBottom = "0px";
    } else if (n === 2) {
      document.getElementById("p2-content").style.paddingTop = (hHeight + 40) + "px";
      document.getElementById("p2-content").style.paddingBottom = fHeight + "px";
    } else if (n === 3) {
      document.getElementById("p3-content").style.paddingTop = (hHeight + 40) + "px";
      document.getElementById("p3-content").style.paddingBottom = fHeight + "px";
    } else if (n === 4) {
      document.getElementById("p4-content").style.paddingTop = "0px";
      document.getElementById("p4-content").style.paddingBottom = fHeight + "px";
    }
    // page 5 is a single self-contained image with its own back-tap zone — no padding needed
    spinner.style.top = (hHeight + SPINNER_GAP - (spinner.offsetHeight / 2)) + "px";
    html.style.background = "#111111";
  }
  function setRefreshText() {
    const now = new Date();
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const d = now.getDate(), mo = months[now.getMonth()], y = now.getFullYear();
    let h = now.getHours();
    const min = String(now.getMinutes()).padStart(2, "0");
    const ampm = h >= 12 ? "pm" : "am";
    h = h % 12 || 12;
    document.getElementById("refresh-text").innerHTML = `Refreshed<br><span id="pulse-group">${d} ${mo} ${y}<br>${h}:${min}${ampm}</span>`;
  }
  function showPage(n) {
    p1.classList.toggle("active", n === 1);
    p2.classList.toggle("active", n === 2);
    p3.classList.toggle("active", n === 3);
    p4.classList.toggle("active", n === 4);
    p5.classList.toggle("active", n === 5);

    h1wrap.style.display = n === 1 ? "block" : "none";
    h2wrap.style.display = n === 2 ? "block" : "none";
    h3wrap.style.display = n === 3 ? "block" : "none";
    if (n === 1) { h1wrap.style.top = "10px"; }
    if (n === 2) { h2wrap.style.top = "0px"; }
    if (n === 3) { h3wrap.style.top = "0px"; }
    p1TopBar.style.display = n === 1 ? "block" : "none";
    f2wrap.style.display = (n === 1 || n === 5) ? "none" : "block";
    if (FOOTER_IMAGES[n]) { document.getElementById("footer2").src = FOOTER_IMAGES[n]; }

    localStorage.setItem("currentPage", n);
    setOffsets();
    window.scrollTo(0, 0);
  }
  function init() {
    setRefreshText();
    showPage(2); // always opens on Home after the intro
    setTimeout(() => { const pg = document.getElementById("pulse-group"); if (pg) pg.classList.add("pulse"); }, 10);
    initCarousel();
    buildHotspotLayer();
    buildSubpages();
    document.querySelectorAll('.footer-zone').forEach(z => {
      z.addEventListener('click', () => showPage(parseInt(z.dataset.page)));
      z.addEventListener('touchend', e => { e.preventDefault(); showPage(parseInt(z.dataset.page)); }, { passive: false });
    });
    const p5Back = document.getElementById('p5-back-zone');
    if (p5Back) {
      p5Back.addEventListener('click', () => showPage(2));
      p5Back.addEventListener('touchend', e => { e.preventDefault(); showPage(2); }, { passive: false });
    }
    initSwipeBack();

    // Intro splash: shows immediately (it's the first thing in the DOM/preloaded
    // with highest priority), then fades to reveal the app already sitting on Home.
    const introSplash = document.getElementById("intro-splash");
    if (introSplash) {
      setTimeout(() => {
        introSplash.style.display = "none";
      }, 2900);
    }
  }
  document.getElementById("header2").addEventListener("click", () => showPage(2));
  window.addEventListener("load", init);
  // Native lock where the browser allows it (installed/fullscreen Android PWAs).
  // No-op elsewhere — the CSS rotation trick above covers the rest.
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock("portrait").catch(() => {});
  }
  window.addEventListener("resize", setOffsets);

  let startY = 0, isDragging = false;
  window.addEventListener("touchstart", e => {
    if (window.scrollY <= 5) { startY = e.touches[0].clientY; isDragging = true; spinner.classList.add("dragging"); }
  }, { passive: true });
  function getDragContent() {
    return p1.classList.contains("active") ? document.getElementById("p1-content") : document.getElementById("p2-content");
  }
  window.addEventListener("touchmove", e => {
    if (!isDragging || spinner.classList.contains("spinning")) return;
    const diffY = e.touches[0].clientY - startY;
    if (diffY > START_THRESHOLD) {
      const progress = Math.min((diffY - START_THRESHOLD) / (RELOAD_THRESHOLD - START_THRESHOLD), 1);
      spinner.style.opacity = progress;
      spinner.style.transform = `rotate(${progress * 90}deg)`;
      getDragContent().style.transition = "none";
      getDragContent().style.transform = `translateY(${progress * HOLD_OFFSET}px)`;
    } else {
      spinner.style.opacity = 0;
      spinner.style.transform = "rotate(0deg)";
      getDragContent().style.transform = "translateY(0)";
    }
  }, { passive: true });
  window.addEventListener("touchend", e => {
    if (!isDragging) return;
    spinner.classList.remove("dragging");
    const diffY = e.changedTouches[0].clientY - startY;
    if (diffY >= RELOAD_THRESHOLD) {
      fakeRefresh();
    } else {
      spinner.style.opacity = 0;
      spinner.style.transform = "rotate(0deg)";
      const c = getDragContent();
      c.style.transition = "transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)";
      c.style.transform = "translateY(0)";
      setTimeout(() => { c.style.transition = ""; }, 300);
    }
    isDragging = false;
  });
  function initSwipeBack() {
    const EDGE = 40;             // must start within this many px of the left edge
    const COMPLETE_RATIO = 0.35; // drag past this fraction of screen width to complete
    const DUR = "0.28s cubic-bezier(0.22, 1, 0.36, 1)";
    let dragging = false, startX = 0, currentX = 0, vw = 0;

    function onStart(e) {
      if (!p1.classList.contains("active")) return;
      const t = e.touches[0];
      if (t.clientX > EDGE) return;
      dragging = true;
      startX = t.clientX;
      currentX = 0;
      vw = window.innerWidth;

      // Bring Home's header/footer/content in as a live layer sliding from the left
      p2.style.display = "block";
      p2.style.position = "fixed";
      p2.style.top = "0"; p2.style.left = "0"; p2.style.width = "100%";
      p2.style.zIndex = "900";
      p2.style.transition = "none";
      p2.style.transform = "translateX(-100%)";

      h2wrap.style.display = "block";
      h2wrap.style.top = "0px";
      h2wrap.style.zIndex = "901";
      h2wrap.style.transition = "none";
      h2wrap.style.transform = "translateX(-100%)";

      f2wrap.style.display = "block";
      f2wrap.style.zIndex = "901";
      f2wrap.style.transition = "none";
      f2wrap.style.transform = "translateX(-100%)";

      p1.style.position = "relative";
      p1.style.zIndex = "950";
      p1.style.transition = "none";
      h1wrap.style.zIndex = "951";
      h1wrap.style.transition = "none";
      p1TopBar.style.zIndex = "951";
      p1TopBar.style.transition = "none";
    }
    function onMove(e) {
      if (!dragging) return;
      const t = e.touches[0];
      currentX = Math.max(0, t.clientX - startX);
      const px = `${currentX}px`;
      p1.style.transform = `translateX(${px})`;
      h1wrap.style.transform = `translateX(${px})`;
      p1TopBar.style.transform = `translateX(${px})`;
      p2.style.transform = `translateX(calc(-100% + ${px}))`;
      h2wrap.style.transform = `translateX(calc(-100% + ${px}))`;
      f2wrap.style.transform = `translateX(calc(-100% + ${px}))`;
    }
    function onEnd() {
      if (!dragging) return;
      dragging = false;
      const complete = currentX > vw * COMPLETE_RATIO;
      [p1, h1wrap, p1TopBar, p2, h2wrap, f2wrap].forEach(el => { el.style.transition = `transform ${DUR}`; });
      const outX = complete ? `${vw}px` : "0px";
      const inX = complete ? "translateX(0)" : "translateX(-100%)";
      p1.style.transform = `translateX(${outX})`;
      h1wrap.style.transform = `translateX(${outX})`;
      p1TopBar.style.transform = `translateX(${outX})`;
      p2.style.transform = inX;
      h2wrap.style.transform = inX;
      f2wrap.style.transform = inX;

      setTimeout(() => {
        [p1, h1wrap, p1TopBar, p2, h2wrap, f2wrap].forEach(el => {
          el.style.position = ""; el.style.top = ""; el.style.left = ""; el.style.width = "";
          el.style.zIndex = ""; el.style.transition = ""; el.style.transform = "";
        });
        if (complete) { showPage(2); }
        else { p2.style.display = "none"; h2wrap.style.display = "none"; f2wrap.style.display = "none"; }
      }, 300);
    }

    window.addEventListener("touchstart", onStart, { passive: true });
    window.addEventListener("touchmove", onMove, { passive: true });
    window.addEventListener("touchend", onEnd);
  }

  function initCarousel() {
    const carousel = document.getElementById("fav-carousel");
    const track = document.getElementById("fav-track");
    if (!carousel || !track) return;
    const cards = track.querySelectorAll(".fav-card");
    const dots = document.querySelectorAll(".fav-dot");
    const N = cards.length;
    let index = 0;
    let cardWidth = 0;
    let didDrag = false;
    let cStartX = 0, cCurrentX = 0, cDragging = false, baseOffset = 0;

    function measure() {
      const r = cards[0].getBoundingClientRect();
      const style = getComputedStyle(cards[0]);
      cardWidth = r.width + parseFloat(style.marginLeft) + parseFloat(style.marginRight);
    }
    function centerOffset() {
      return (carousel.clientWidth - cardWidth) / 2;
    }
    function setTransform(px, animate) {
      track.style.transition = animate ? "transform 0.26s cubic-bezier(0.22, 1, 0.36, 1)" : "none";
      track.style.transform = `translateX(${px}px)`;
    }
    function goTo(i, animate = true) {
      index = Math.max(0, Math.min(N - 1, i));
      const px = centerOffset() - index * cardWidth;
      setTransform(px, animate);
      updateDots();
      updateScale(index, animate);
    }
    function updateDots(progressIndex) {
      const active = progressIndex !== undefined ? progressIndex : index;
      dots.forEach((d, i) => {
        const dist = Math.max(0, 1 - Math.abs(active - i));
        d.style.background = `rgba(120,190,255,${0.3 + dist * 0.7})`;
      });
    }
    function updateScale(progressIndex, animate) {
      const active = progressIndex !== undefined ? progressIndex : index;
      cards.forEach((card, i) => {
        card.style.transition = animate ? "transform 0.26s cubic-bezier(0.22, 1, 0.36, 1)" : "none";
        const dist = Math.min(Math.abs(active - i), 1);
        const scale = 1 - dist * 0.2; // 100% centered, 80% when fully off to a side
        card.style.transform = `scale(${scale})`;
      });
    }

    let lastMoveX = 0, lastMoveT = 0, velocity = 0, rafPending = false, pendingDiff = 0;

    track.addEventListener("touchstart", e => {
      measure();
      cDragging = true;
      didDrag = false;
      cStartX = e.touches[0].clientX;
      lastMoveX = cStartX;
      lastMoveT = performance.now();
      velocity = 0;
      baseOffset = centerOffset() - index * cardWidth;
      track.style.transition = "none";
      cards.forEach(c => { c.style.transition = "none"; });
      e.stopPropagation();
    }, { passive: true });

    function applyDrag(diff) {
      rafPending = false;
      track.style.transform = `translateX(${baseOffset + diff}px)`;
      updateDots(index - diff / cardWidth);
      updateScale(index - diff / cardWidth, false);
    }

    track.addEventListener("touchmove", e => {
      if (!cDragging) return;
      cCurrentX = e.touches[0].clientX;
      const now = performance.now();
      const dt = now - lastMoveT;
      if (dt > 0) velocity = (cCurrentX - lastMoveX) / dt; // px per ms
      lastMoveX = cCurrentX; lastMoveT = now;

      const diff = cCurrentX - cStartX;
      if (Math.abs(diff) > 8) {
        if (!didDrag) { cards.forEach(c => c.classList.remove("pressed")); }
        didDrag = true;
      }
      pendingDiff = diff;
      if (!rafPending) { rafPending = true; requestAnimationFrame(() => applyDrag(pendingDiff)); }
      e.stopPropagation();
    }, { passive: true });

    track.addEventListener("touchend", e => {
      if (!cDragging) return;
      cDragging = false;
      const diff = cCurrentX - cStartX;
      const FLICK_VELOCITY = 0.35; // px/ms — a quick flick snaps even on a small drag
      const distanceThreshold = cardWidth * 0.2;
      if (Math.abs(velocity) > FLICK_VELOCITY) {
        if (velocity < 0) goTo(index + 1);
        else goTo(index - 1);
      } else if (diff <= -distanceThreshold) {
        goTo(index + 1);
      } else if (diff >= distanceThreshold) {
        goTo(index - 1);
      } else {
        goTo(index);
      }
      cCurrentX = cStartX;
      e.stopPropagation();
    });

    window.addEventListener("resize", () => { measure(); goTo(index, false); });
    measure();
    goTo(0, false);

    // The FIRST card opens page 5, and only while it's the active/centred one
    // Darken a card while it's being pressed (only when it's the centred/openable one)
    function wirePress(cardEl, cardIndex) {
      cardEl.addEventListener("touchstart", () => {
        if (index === cardIndex) cardEl.classList.add("pressed");
      }, { passive: true });
      cardEl.addEventListener("mousedown", () => {
        if (index === cardIndex) cardEl.classList.add("pressed");
      });
      ["touchend", "touchcancel", "mouseup", "mouseleave"].forEach(evt => {
        cardEl.addEventListener(evt, () => cardEl.classList.remove("pressed"));
      });
    }

    const firstCard = cards[0];
    if (firstCard) {
      firstCard.style.cursor = "pointer";
      wirePress(firstCard, 0);
      firstCard.addEventListener("click", e => {
        if (didDrag) return;
        if (index !== 0) return;
        e.stopPropagation();
        showPage(5);
      });
      firstCard.addEventListener("touchend", e => {
        if (didDrag) return;
        if (index !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        showPage(5);
      }, { passive: false });
    }

    // Only the SECOND card opens page 1, and only while it's the active/centred one
    const secondCard = cards[1];
    if (secondCard) {
      secondCard.style.cursor = "pointer";
      wirePress(secondCard, 1);
      secondCard.addEventListener("click", e => {
        if (didDrag) return;
        if (index !== 1) return;
        e.stopPropagation();
        showPage(1);
      });
      secondCard.addEventListener("touchend", e => {
        if (didDrag) return;
        if (index !== 1) return;
        e.preventDefault();
        e.stopPropagation();
        showPage(1);
      }, { passive: false });
    }
  }

  /* ══════════════ Hotspot links (positions locked in) ══════════════ */
  // top/left/width/height are all percentages relative to the page-2 image,
  // so they stay aligned regardless of screen size. "target" must match a
  // key in SUBPAGES below.
  const HOTSPOTS = [
    { id: 'registrations', label: 'Registrations',   top: 49.13, left: 6.03, width: 90.46, height: 5.37, target: 'registrations' },
    { id: 'fines',         label: 'Fines & demerits', top: 56.05, left: 4.28, width: 90.72, height: 4.59, target: 'fines' },
    { id: 'vouchers',      label: 'Vouchers',         top: 61.86, left: 5.77, width: 89.95, height: 6.06, target: 'vouchers' },
    { id: 'disaster',      label: 'Disaster support', top: 68.69, left: 4.28, width: 92,    height: 5.8,  target: 'disaster' },
    { id: 'locations',     label: 'Locations',        top: 75.45, left: 4.23, width: 91.23, height: 5.45, target: 'locations' },
    { id: 'qrcheckin',     label: 'QR check-in',      top: 81.77, left: 3.77, width: 91.74, height: 5.71, target: 'qrcheckin' },
    { id: 'checklicence',  label: 'Check licence',    top: 88.27, left: 5.26, width: 91.49, height: 5.88, target: 'checklicence' },
    { id: 'help',          label: 'Help & support',   top: 97,    left: 4.54, width: 42.26, height: 3,    target: 'help' },
    // Featured carousel cards — external links
    { id: 'organ-donor',    label: 'Organ donor (ext)',    top: 30.14, left: 5.11,  width: 37.37, height: 12.49, url: 'https://www.donatelife.gov.au/register-donor-today' },
    { id: 'cost-of-living', label: 'Cost of living (ext)', top: 29.97, left: 47.11, width: 39.73, height: 12.58, url: 'https://www.nsw.gov.au/money-and-taxes/cost-of-living-hub' },
  ];
  // A hotspot with "target" opens an internal SUBPAGES screen.
  // A hotspot with "url" instead opens that link externally.

  // Each key is a destination screen, matching the screen-by-screen spec.
  const SUBPAGES = {
    registrations: {
      title: 'Registrations', type: 'camera', tabs: ['Check plate', 'My registrations'],
      heading: 'Check or renew a registration',
      bullets: ['Scan a plate using your camera, or', 'Enter a plate number manually'],
      frame: 'rect', torch: true, scanBtn: true,
      fieldLabel: 'Enter plate number',
    },
    fines: {
      title: 'Fines and demerits', type: 'empty', tabs: ['Fines', 'Demerits'],
      emptyTitle: "You don't have any vehicle-related fines.",
      infoLine: "Can't see an overdue fine?",
      fieldLabel: 'Search penalty notice number',
    },
    vouchers: {
      title: 'Vouchers', type: 'empty', tabs: ['My vouchers', 'Browse'], badge: '1', help: true,
      icon: '🎟️',
      emptyTitle: "You don't have any vouchers yet",
      emptySub: "Tap on 'Browse' to learn about our available vouchers and check your eligibility.",
    },
    disaster: {
      title: 'Disaster support & grants', type: 'empty', tabs: ['Resources', 'My grants'],
      emptyTitle: 'Storms and Floods · Bushfires', emptySub: 'Preparation guides and support are listed here.',
    },
    locations: {
      title: 'Locations', type: 'empty', fieldLabel: 'Search by suburb or postcode',
      icon: '📍',
      emptySub: 'Enter a suburb or postcode to find a Service Centre or Mobile Service Centre.',
    },
    qrcheckin: {
      title: 'Verify', type: 'camera',
      heading: 'Ready to scan',
      instruction: 'Place camera over the QR code of the digital licence or credential to help determine it’s genuine.',
      frame: 'square', torch: false, scanBtn: false,
    },
    checklicence: {
      title: 'Verify', type: 'menu',
      heading: 'Select what you need to check:',
      items: [
        { icon: '▦', label: 'Verify a licence or credential', desc: 'Scan the QR code on a licence or credential to check is genuine.', target: 'qrcheckin' },
        { icon: '📄', label: 'Verify a Birth Certificate', desc: 'Identify someone using their Birth Certificate details.' },
        { icon: '🪪', label: 'Verify a Driver Licence', desc: 'Identify someone using their Driver Licence details.', info: 'Only works with an upgraded Driver Licence.' },
        { icon: '🪪', label: 'Verify a Photo Card', desc: 'Identify someone using their Photo Card details.', info: 'Only works with an upgraded Photo Card.' },
      ],
    },
    help: {
      title: 'Help and support', type: 'empty',
      emptyTitle: 'Would you like to give feedback or tell us about a problem?',
      emptySub: 'Give feedback, or report an issue — our team is on hand if it’s urgent.',
    },
  };

  function buildHotspotLayer() {
    const hotspotLayer = document.createElement('div');
    hotspotLayer.id = 'hotspot-layer';
    document.getElementById('page2-media-wrap').appendChild(hotspotLayer);
    HOTSPOTS.forEach(hs => {
      const el = document.createElement('div');
      el.className = 'hotspot';
      el.dataset.id = hs.id;
      el.style.top = hs.top + '%';
      el.style.left = hs.left + '%';
      el.style.width = hs.width + '%';
      el.style.height = hs.height + '%';
      el.addEventListener('click', e => {
        e.preventDefault();
        if (hs.url) { window.open(hs.url, '_blank', 'noopener'); }
        else { showSubpage(hs.target); }
      });
      hotspotLayer.appendChild(el);
    });
  }

  /* ══════════════ Generic sub-pages ══════════════ */
  function buildSubpages() {
    const container = document.createElement('div');
    container.id = 'subpage-container';
    Object.entries(SUBPAGES).forEach(([key, cfg]) => {
      const sp = document.createElement('div');
      sp.className = 'subpage';
      sp.dataset.id = key;
      sp.innerHTML = subpageHTML(cfg);
      container.appendChild(sp);
      sp.querySelector('.sp-back').addEventListener('click', () => hideSubpage(key));
      sp.querySelectorAll('.sp-menu-item[data-target]').forEach(item => {
        item.addEventListener('click', () => showSubpage(item.dataset.target));
      });
    });
    document.body.appendChild(container);
  }

  function subpageHTML(cfg) {
    const tabsHTML = cfg.tabs
      ? `<div class="sp-tabs">${cfg.tabs.map((t, i) =>
          `<div class="sp-tab${i === 0 ? ' active' : ''}">${t}${cfg.badge && t === 'Browse' ? `<span class="sp-badge">${cfg.badge}</span>` : ''}</div>`
        ).join('')}${cfg.help ? '<div class="sp-help-link">Help</div>' : ''}</div>`
      : '';
    const header = `<div class="sp-header"><div class="sp-back">\u2039</div><div class="sp-title">${cfg.title}</div></div>`;

    if (cfg.type === 'camera') {
      return `
        ${header}
        ${tabsHTML}
        ${cfg.heading || cfg.instruction ? `<div class="sp-body" style="padding-bottom:0">
          ${cfg.heading ? `<div class="sp-heading">${cfg.heading}</div>` : ''}
          ${cfg.bullets ? `<ul class="sp-bullets">${cfg.bullets.map(b => `<li>${b}</li>`).join('')}</ul>` : ''}
          ${cfg.instruction ? `<div class="sp-instruction">${cfg.instruction}</div>` : ''}
        </div>` : ''}
        <div class="sp-camera">
          <video autoplay playsinline muted></video>
          <div class="sp-camera-msg">Camera access is needed for this feature. Allow it in your browser settings, or enter details manually.</div>
          <div class="sp-viewfinder ${cfg.frame === 'square' ? 'square' : ''}"><span class="sp-corner tl"></span><span class="sp-corner tr"></span><span class="sp-corner bl"></span><span class="sp-corner br"></span></div>
          ${cfg.torch || cfg.scanBtn ? `<div class="sp-cam-controls">
            ${cfg.torch ? '<button class="sp-torch-btn">Torch on</button>' : '<span style="width:70px"></span>'}
            ${cfg.scanBtn ? '<button class="sp-scan-btn"></button>' : '<span style="width:64px"></span>'}
            <span style="width:70px"></span>
          </div>` : ''}
        </div>
        ${cfg.fieldLabel ? `<div class="sp-body">
          <div class="sp-field-label">${cfg.fieldLabel}</div>
          <div class="sp-field"></div>
        </div>` : ''}`;
    }

    if (cfg.type === 'menu') {
      return `
        ${header}
        <div class="sp-body">
          ${cfg.heading ? `<div class="sp-heading" style="font-size:16px">${cfg.heading}</div>` : ''}
          ${cfg.items.map(it => `
            <div class="sp-menu-item"${it.target ? ` data-target="${it.target}"` : ''}>
              <div class="sp-menu-icon">${it.icon}</div>
              <div class="sp-menu-text">
                <div class="sp-menu-label">${it.label}</div>
                <div class="sp-menu-desc">${it.desc}</div>
                ${it.info ? `<div class="sp-menu-info"><span class="sp-info-dot">i</span><span>${it.info}</span></div>` : ''}
              </div>
              <div class="sp-menu-arrow">\u203a</div>
            </div>`).join('')}
        </div>`;
    }

    // type: 'empty'
    return `
      ${header}
      ${cfg.fieldLabel ? `<div class="sp-body" style="padding-bottom:0">
        <div class="sp-field-label" style="margin-top:0">${cfg.fieldLabel}</div>
        <div class="sp-field"></div>
      </div>` : ''}
      ${tabsHTML}
      <div class="sp-body">
        ${cfg.icon ? `<div class="sp-illustration">${cfg.icon}</div>` : ''}
        ${cfg.emptyTitle ? `<div class="sp-empty-title">${cfg.emptyTitle}</div>` : ''}
        ${cfg.emptySub ? `<div class="sp-empty-sub">${cfg.emptySub}</div>` : ''}
        ${cfg.infoLine ? `<div class="sp-info-line"><span class="sp-info-dot">i</span><span>${cfg.infoLine}</span></div>` : ''}
      </div>`;
  }

  function showSubpage(id) {
    const sp = document.querySelector(`.subpage[data-id="${id}"]`);
    if (!sp) return;
    sp.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (SUBPAGES[id].type === 'camera') startCamera(sp);
  }

  function hideSubpage(id) {
    const sp = document.querySelector(`.subpage[data-id="${id}"]`);
    if (!sp) return;
    sp.classList.remove('open');
    document.body.style.overflow = '';
    stopCamera(sp);
  }

  async function startCamera(sp) {
    const video = sp.querySelector('video');
    const msg = sp.querySelector('.sp-camera-msg');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      sp._stream = stream;
      msg.style.display = 'none';
    } catch (err) {
      msg.style.display = 'flex';
    }
  }
  function stopCamera(sp) {
    if (sp._stream) { sp._stream.getTracks().forEach(t => t.stop()); sp._stream = null; }
  }
</script>
</body>
</html>
