<script>
  const GIF_SRC = "https://file.garden/aeSpG6iUoRzyQ8ca/Untitled%20(11).gif";
  const p1 = document.getElementById("page1");
  const p2 = document.getElementById("page2");
  const h1wrap = document.getElementById("h1-wrap");
  const h2wrap = document.getElementById("h2-wrap");
  const f2wrap = document.getElementById("f2-wrap");
  const p1TopBar = document.getElementById("p1-top-bar");
  const spinner = document.getElementById("spinner");
  const html = document.documentElement;
  const popupOverlay = document.getElementById("popup-overlay");
  const popupSheet = document.getElementById("popup-sheet");
  const mainGif = document.getElementById("main-gif");
  const privacyCover = document.getElementById("privacy-cover");
  const RELOAD_THRESHOLD = 190;
  const START_THRESHOLD = 40;
  const SPINNER_GAP = 24;

  let coverTimer = null;
  function showCover() { privacyCover.style.display = "block"; }
  function hideCover() { clearTimeout(coverTimer); privacyCover.style.display = "none"; }
  window.addEventListener("blur", () => { coverTimer = setTimeout(showCover, 80); });
  window.addEventListener("focus", hideCover);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { showCover(); } else { hideCover(); }
  });
  window.addEventListener("pagehide", showCover);
  window.addEventListener("pageshow", hideCover);

  function openPopup() {
    popupOverlay.style.display = "block";
    popupOverlay.getBoundingClientRect();
    popupOverlay.classList.add("open");
    popupSheet.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closePopup() {
    popupOverlay.classList.remove("open");
    popupSheet.classList.remove("open");
    document.body.style.overflow = "";
    popupOverlay.addEventListener("transitionend", function h() {
      if (!popupOverlay.classList.contains("open")) popupOverlay.style.display = "none";
      popupOverlay.removeEventListener("transitionend", h);
    });
  }
  popupOverlay.addEventListener("touchend", e => { e.preventDefault(); closePopup(); }, { passive: false });
  popupOverlay.addEventListener("click", closePopup);
  let sheetStartY = 0;
  popupSheet.addEventListener("touchstart", e => { sheetStartY = e.touches[0].clientY; }, { passive: true });
  popupSheet.addEventListener("touchend", e => { if (e.changedTouches[0].clientY - sheetStartY > 60) closePopup(); }, { passive: true });

  function openModal(id) {
    const el = document.getElementById(id);
    el.style.display = "flex";
    el.getBoundingClientRect();
    el.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeModal(id) {
    const el = document.getElementById(id);
    el.classList.remove("open");
    document.body.style.overflow = "";
    setTimeout(() => { if (!el.classList.contains("open")) el.style.display = "none"; }, 300);
  }
  ["licence-modal", "conditions-modal"].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener("click", e => { if (e.target === el) closeModal(id); });
    el.addEventListener("touchend", e => { if (e.target === el) { e.preventDefault(); closeModal(id); } }, { passive: false });
  });
  document.getElementById("licence-close").addEventListener("click", () => closeModal("licence-modal"));
  document.getElementById("licence-close").addEventListener("touchend", e => { e.preventDefault(); closeModal("licence-modal"); }, { passive: false });
  document.getElementById("conditions-close").addEventListener("click", () => closeModal("conditions-modal"));
  document.getElementById("conditions-close").addEventListener("touchend", e => { e.preventDefault(); closeModal("conditions-modal"); }, { passive: false });

  function addTapZone(id, fn) {
    const el = document.getElementById(id);
    let tDown = 0;
    el.addEventListener("touchstart", () => { tDown = Date.now(); }, { passive: true });
    el.addEventListener("touchend", e => { if (Date.now() - tDown < 300) { e.preventDefault(); fn(); } }, { passive: false });
    el.addEventListener("click", fn);
  }
  addTapZone("licence-tap-left", () => openModal("licence-modal"));
  addTapZone("licence-tap-right", () => openModal("conditions-modal"));

  function addZoneTap(id, fn) {
    const el = document.getElementById(id);
    let tDown = 0;
    el.addEventListener("touchstart", () => { tDown = Date.now(); }, { passive: true });
    el.addEventListener("touchend", e => { if (Date.now() - tDown < 300) { e.preventDefault(); fn(); } }, { passive: false });
    el.addEventListener("click", fn);
  }
  addZoneTap("header1-left", () => showPage(2));
  addZoneTap("header1-right", openPopup);

  const HOLD_OFFSET = 52;
  function fakeRefresh() {
    const activeContent = p1.classList.contains("active") ? document.getElementById("p1-content") : document.getElementById("p2-content");
    spinner.classList.add("spinning");
    setTimeout(() => {
      setRefreshText();
      requestAnimationFrame(() => {
        const pg = document.getElementById("pulse-group");
        if (pg) { pg.classList.remove("pulse"); void pg.offsetWidth; pg.classList.add("pulse"); }
      });
      const img = new Image();
      img.onload = () => { mainGif.src = GIF_SRC + (GIF_SRC.includes("?") ? "&" : "?") + "_=" + Date.now() % 100000; };
      img.src = GIF_SRC;
      activeContent.style.transition = "transform 0.35s cubic-bezier(0.32, 0.72, 0, 1)";
      activeContent.style.transform = "translateY(0)";
      spinner.classList.remove("spinning");
      spinner.style.transition = "opacity 0.4s";
      spinner.style.opacity = "0";
      setTimeout(() => { spinner.style.transition = ""; spinner.style.transform = "rotate(0deg)"; activeContent.style.transition = ""; }, 400);
    }, 750);
  }
  function setOffsets() {
    const isP1 = p1.classList.contains("active");
    const topOff = isP1 ? 10 : 0;
    const hHeight = (isP1 ? h1wrap.offsetHeight : h2wrap.offsetHeight) + topOff;
    const fHeight = f2wrap.offsetHeight || 60;
    document.getElementById("p1-content").style.paddingTop = hHeight + "px";
    document.getElementById("p2-content").style.paddingTop = (hHeight + 40) + "px";
    document.getElementById("p2-content").style.paddingBottom = fHeight + "px";
    spinner.style.top = (hHeight + SPINNER_GAP - (spinner.offsetHeight / 2)) + "px";
    html.style.background = isP1 ? "#111111" : "rgb(0, 37, 100)";
  }
  function setRefreshText() {
    const now = new Date();
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const d = now.getDate(), mo = months[now.getMonth()], y = now.getFullYear();
    let h = now.getHours();
    const min = String(now.getMinutes()).padStart(2, "0");
    const ampm = h >= 12 ? "pm" : "am";
    h = h % 12 || 12;
    document.getElementById("refresh-text").innerHTML = `Refreshed<br><span id="pulse-group">${d} ${mo} ${y}<br>${h}:${min}${ampm}</span>`;
  }
  function showPage(n) {
    p1.classList.toggle("active", n === 1);
    p2.classList.toggle("active", n === 2);
    if (n === 1) {
      h1wrap.style.display = "block"; h1wrap.style.top = "10px";
      h2wrap.style.display = "none";
      p1TopBar.style.display = "block";
    } else {
      h1wrap.style.display = "none";
      h2wrap.style.display = "block"; h2wrap.style.top = "0px";
      p1TopBar.style.display = "none";
    }
    localStorage.setItem("currentPage", n);
    setOffsets();
    window.scrollTo(0, 0);
  }
  function init() {
    setRefreshText();
    const saved = localStorage.getItem("currentPage");
    showPage(saved ? parseInt(saved) : 2);
    setTimeout(() => { const pg = document.getElementById("pulse-group"); if (pg) pg.classList.add("pulse"); }, 10);
    initCarousel();
    buildHotspotLayer();
    buildSubpages();
    readoutEl = document.getElementById("hotspot-readout");
    document.getElementById("hotspot-toggle-btn").addEventListener("click", toggleEditMode);
    document.getElementById("hotspot-add-btn").addEventListener("click", addHotspot);
    updateReadout();
  }
  document.getElementById("header2").addEventListener("click", () => showPage(1));
  window.addEventListener("load", init);
  window.addEventListener("resize", setOffsets);

  let startY = 0, isDragging = false;
  window.addEventListener("touchstart", e => {
    if (window.scrollY <= 5) { startY = e.touches[0].clientY; isDragging = true; spinner.classList.add("dragging"); }
  }, { passive: true });
  function getDragContent() {
    return p1.classList.contains("active") ? document.getElementById("p1-content") : document.getElementById("p2-content");
  }
  window.addEventListener("touchmove", e => {
    if (!isDragging || spinner.classList.contains("spinning")) return;
    const diffY = e.touches[0].clientY - startY;
    if (diffY > START_THRESHOLD) {
      const progress = Math.min((diffY - START_THRESHOLD) / (RELOAD_THRESHOLD - START_THRESHOLD), 1);
      spinner.style.opacity = progress;
      spinner.style.transform = `rotate(${progress * 90}deg)`;
      getDragContent().style.transition = "none";
      getDragContent().style.transform = `translateY(${progress * HOLD_OFFSET}px)`;
    } else {
      spinner.style.opacity = 0;
      spinner.style.transform = "rotate(0deg)";
      getDragContent().style.transform = "translateY(0)";
    }
  }, { passive: true });
  window.addEventListener("touchend", e => {
    if (!isDragging) return;
    spinner.classList.remove("dragging");
    const diffY = e.changedTouches[0].clientY - startY;
    if (diffY >= RELOAD_THRESHOLD) {
      fakeRefresh();
    } else {
      spinner.style.opacity = 0;
      spinner.style.transform = "rotate(0deg)";
      const c = getDragContent();
      c.style.transition = "transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)";
      c.style.transform = "translateY(0)";
      setTimeout(() => { c.style.transition = ""; }, 300);
    }
    isDragging = false;
  });
  let startX = 0;
  window.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, { passive: true });
  window.addEventListener("touchend", e => {
    const diffX = e.changedTouches[0].clientX - startX;
    if (p1.classList.contains("active") && startX < 50 && diffX > 80) showPage(2);
  });

  function initCarousel() {
    const carousel = document.getElementById("fav-carousel");
    const track = document.getElementById("fav-track");
    if (!carousel || !track) return;
    const cards = track.querySelectorAll(".fav-card");
    const dots = document.querySelectorAll(".fav-dot");
    const N = cards.length;
    let index = 0;
    let cardWidth = 0;
    let didDrag = false;
    let cStartX = 0, cCurrentX = 0, cDragging = false, baseOffset = 0;

    function measure() {
      const r = cards[0].getBoundingClientRect();
      const style = getComputedStyle(cards[0]);
      cardWidth = r.width + parseFloat(style.marginLeft) + parseFloat(style.marginRight);
    }
    function centerOffset() {
      return (carousel.clientWidth - cardWidth) / 2;
    }
    function setTransform(px, animate) {
      track.style.transition = animate ? "transform 0.32s cubic-bezier(0.32,0.72,0,1)" : "none";
      track.style.transform = `translateX(${px}px)`;
    }
    function goTo(i, animate = true) {
      index = Math.max(0, Math.min(N - 1, i));
      const px = centerOffset() - index * cardWidth;
      setTransform(px, animate);
      updateDots();
    }
    function updateDots(progressIndex) {
      const active = progressIndex !== undefined ? progressIndex : index;
      dots.forEach((d, i) => {
        const dist = Math.max(0, 1 - Math.abs(active - i));
        d.style.background = `rgba(120,190,255,${0.3 + dist * 0.7})`;
      });
    }

    track.addEventListener("touchstart", e => {
      measure();
      cDragging = true;
      didDrag = false;
      cStartX = e.touches[0].clientX;
      baseOffset = centerOffset() - index * cardWidth;
      track.style.transition = "none";
      e.stopPropagation();
    }, { passive: true });

    track.addEventListener("touchmove", e => {
      if (!cDragging) return;
      cCurrentX = e.touches[0].clientX;
      const diff = cCurrentX - cStartX;
      if (Math.abs(diff) > 8) didDrag = true;
      track.style.transform = `translateX(${baseOffset + diff}px)`;
      updateDots(index - diff / cardWidth);
      e.stopPropagation();
    }, { passive: true });

    track.addEventListener("touchend", e => {
      if (!cDragging) return;
      cDragging = false;
      const diff = cCurrentX - cStartX;
      const threshold = cardWidth * 0.2;
      if (diff <= -threshold) goTo(index + 1);
      else if (diff >= threshold) goTo(index - 1);
      else goTo(index);
      cCurrentX = cStartX;
      e.stopPropagation();
    });

    window.addEventListener("resize", () => { measure(); goTo(index, false); });
    measure();
    goTo(0, false);

    // Only the SECOND card opens page 1, and only while it's the active/centred one
    const secondCard = cards[1];
    if (secondCard) {
      secondCard.style.cursor = "pointer";
      secondCard.addEventListener("click", e => {
        if (didDrag) return;
        if (index !== 1) return;
        e.stopPropagation();
        showPage(1);
      });
      secondCard.addEventListener("touchend", e => {
        if (didDrag) return;
        if (index !== 1) return;
        e.preventDefault();
        e.stopPropagation();
        showPage(1);
      }, { passive: false });
    }
  }

  /* ══════════════ Hotspot link editor ══════════════ */
  // Edit each entry below (or drag/resize on-screen) to line hotspots up with
  // the images on page 2. top/left/width/height are all percentages relative
  // to the page-2 image, so they stay aligned regardless of screen size.
  // "target" must match a key in SUBPAGES further down.
  let HOTSPOTS = [
    { id: 'registrations', label: 'Registrations',   top: 49.13, left: 6.03, width: 90.46, height: 5.37, target: 'registrations' },
    { id: 'fines',         label: 'Fines & demerits', top: 56.05, left: 4.28, width: 90.72, height: 4.59, target: 'fines' },
    { id: 'vouchers',      label: 'Vouchers',         top: 61.86, left: 5.77, width: 89.95, height: 6.06, target: 'vouchers' },
    { id: 'disaster',      label: 'Disaster support', top: 68.69, left: 4.28, width: 92,    height: 5.8,  target: 'disaster' },
    { id: 'locations',     label: 'Locations',        top: 75.45, left: 4.23, width: 91.23, height: 5.45, target: 'locations' },
    { id: 'qrcheckin',     label: 'QR check-in',      top: 81.77, left: 3.77, width: 91.74, height: 5.71, target: 'qrcheckin' },
    { id: 'checklicence',  label: 'Check licence',    top: 88.27, left: 5.26, width: 91.49, height: 5.88, target: 'checklicence' },
    { id: 'help',          label: 'Help & support',   top: 97,    left: 4.54, width: 42.26, height: 3,    target: 'help' },
  ];

  // Each key is a destination screen. type:'camera' renders a live camera
  // viewfinder; type:'list' renders a header/tabs/empty-state screen.
  const SUBPAGES = {
    registrations: { title: 'Registrations', type: 'camera', tabs: ['Check plate', 'My registrations'] },
    fines:         { title: 'Fines and demerits', type: 'list', tabs: ['Fines', 'Demerits'], empty: "You don't have any vehicle-related fines." },
    vouchers:      { title: 'Vouchers', type: 'list', tabs: ['My vouchers', 'Browse'], loading: true, empty: "You don't have any vouchers yet." },
    disaster:      { title: 'Disaster support & grants', type: 'list', tabs: ['Resources', 'My grants'], empty: 'Storms and Floods · Bushfires — preparation guides.' },
    locations:     { title: 'Locations', type: 'list', loading: true, empty: 'Search for a service centre near you.' },
    qrcheckin:     { title: 'QR code check-in', type: 'camera', tabs: ['Scan', 'Last check-in'] },
    checklicence:  { title: 'Check a licence or credential', type: 'list', empty: 'Verify a licence or credential · Verify a Birth Certificate · Verify a Driver Licence · Verify a Photo Card.' },
    help:          { title: 'Help and support', type: 'list', empty: 'Would you like to give feedback or tell us about a problem?' },
  };

  let editMode = true;
  let readoutCollapsed = false;
  let hotspotLayer, readoutEl;

  function buildHotspotLayer() {
    hotspotLayer = document.createElement('div');
    hotspotLayer.id = 'hotspot-layer';
    document.getElementById('page2-media-wrap').appendChild(hotspotLayer);
    renderHotspots();
  }

  function renderHotspots() {
    hotspotLayer.innerHTML = '';
    HOTSPOTS.forEach(hs => {
      const el = document.createElement('div');
      el.className = 'hotspot' + (editMode ? ' edit' : '');
      el.dataset.id = hs.id;
      el.style.top = hs.top + '%';
      el.style.left = hs.left + '%';
      el.style.width = hs.width + '%';
      el.style.height = hs.height + '%';
      if (editMode) {
        el.innerHTML = `<span class="hs-label">${hs.label}</span><span class="hs-delete">\u00d7</span><span class="hs-resize"></span>`;
      }
      hotspotLayer.appendChild(el);
      wireHotspot(el, hs);
    });
    updateReadout();
  }

  function wireHotspot(el, hs) {
    el.addEventListener('click', e => {
      if (editMode) return;
      e.preventDefault();
      showSubpage(hs.target);
    });
    if (!editMode) return;

    const del = el.querySelector('.hs-delete');
    del.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); removeHotspot(hs.id); }, { passive: false });
    del.addEventListener('click', e => { e.stopPropagation(); removeHotspot(hs.id); });

    const resizeHandle = el.querySelector('.hs-resize');
    let mode = null, sx = 0, sy = 0, orig = {};
    const wrap = document.getElementById('page2-media-wrap');
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    function start(e, m) {
      mode = m;
      const t = e.touches ? e.touches[0] : e;
      sx = t.clientX; sy = t.clientY;
      orig = { top: hs.top, left: hs.left, width: hs.width, height: hs.height };
      e.stopPropagation();
    }
    function move(e) {
      if (!mode) return;
      const t = e.touches ? e.touches[0] : e;
      const r = wrap.getBoundingClientRect();
      const dxPct = ((t.clientX - sx) / r.width) * 100;
      const dyPct = ((t.clientY - sy) / r.height) * 100;
      if (mode === 'drag') {
        hs.left = clamp(orig.left + dxPct, 0, 100 - hs.width);
        hs.top = clamp(orig.top + dyPct, 0, 100 - hs.height);
      } else {
        hs.width = clamp(orig.width + dxPct, 3, 100 - hs.left);
        hs.height = clamp(orig.height + dyPct, 3, 100 - hs.top);
      }
      el.style.top = hs.top + '%'; el.style.left = hs.left + '%';
      el.style.width = hs.width + '%'; el.style.height = hs.height + '%';
      updateReadout();
    }
    function end() { mode = null; }

    el.addEventListener('touchstart', e => start(e, 'drag'), { passive: true });
    el.addEventListener('mousedown', e => start(e, 'drag'));
    resizeHandle.addEventListener('touchstart', e => start(e, 'resize'), { passive: true });
    resizeHandle.addEventListener('mousedown', e => start(e, 'resize'));
    window.addEventListener('touchmove', move, { passive: true });
    window.addEventListener('mousemove', move);
    window.addEventListener('touchend', end);
    window.addEventListener('mouseup', end);
  }

  function removeHotspot(id) {
    HOTSPOTS = HOTSPOTS.filter(h => h.id !== id);
    renderHotspots();
  }

  function addHotspot() {
    const id = 'link' + Date.now();
    HOTSPOTS.push({ id, label: 'New link', top: 40, left: 30, width: 40, height: 9, target: 'help' });
    renderHotspots();
  }

  function updateReadout() {
    if (!readoutEl) return;
    readoutEl.classList.toggle('collapsed', readoutCollapsed);
    const rows = readoutCollapsed ? '' : HOTSPOTS.map(h =>
      `<div class="row"><span>${h.label}</span><span>top:${h.top.toFixed(1)}% left:${h.left.toFixed(1)}% w:${h.width.toFixed(1)}% h:${h.height.toFixed(1)}%</span></div>`
    ).join('');
    readoutEl.innerHTML = `
      <div id="hotspot-readout-bar">
        <button id="hotspot-copy-btn">Copy config</button>
        <button id="hotspot-collapse-btn">${readoutCollapsed ? 'Show list \u25B2' : 'Hide list \u25BC'}</button>
      </div>
      ${rows}`;
    document.getElementById('hotspot-copy-btn').addEventListener('click', copyConfig);
    document.getElementById('hotspot-collapse-btn').addEventListener('click', () => {
      readoutCollapsed = !readoutCollapsed;
      updateReadout();
    });
  }

  function copyConfig() {
    const json = JSON.stringify(HOTSPOTS.map(({ id, label, top, left, width, height, target }) =>
      ({ id, label, top: +top.toFixed(2), left: +left.toFixed(2), width: +width.toFixed(2), height: +height.toFixed(2), target })), null, 2);
    if (navigator.clipboard) navigator.clipboard.writeText(json).catch(() => {});
    const btn = document.getElementById('hotspot-copy-btn');
    if (btn) { const old = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = old; }, 1200); }
  }

  function toggleEditMode() {
    editMode = !editMode;
    document.getElementById('hotspot-toggle-btn').textContent = editMode ? 'Preview links' : 'Edit links';
    document.getElementById('hotspot-add-btn').style.display = editMode ? 'block' : 'none';
    readoutEl.classList.toggle('show', editMode);
    renderHotspots();
  }

  /* ══════════════ Generic sub-pages ══════════════ */
  function buildSubpages() {
    const container = document.createElement('div');
    container.id = 'subpage-container';
    Object.entries(SUBPAGES).forEach(([key, cfg]) => {
      const sp = document.createElement('div');
      sp.className = 'subpage';
      sp.dataset.id = key;
      sp.innerHTML = subpageHTML(cfg);
      container.appendChild(sp);
      sp.querySelector('.sp-back').addEventListener('click', () => hideSubpage(key));
    });
    document.body.appendChild(container);
  }

  function subpageHTML(cfg) {
    const tabs = cfg.tabs ? `<div class="sp-tabs">${cfg.tabs.map((t, i) => `<div class="sp-tab${i === 0 ? ' active' : ''}">${t}</div>`).join('')}</div>` : '';
    if (cfg.type === 'camera') {
      return `
        <div class="sp-header"><div class="sp-back">\u2039</div><div class="sp-title">${cfg.title}</div></div>
        ${tabs}
        <div class="sp-camera">
          <video autoplay playsinline muted></video>
          <div class="sp-camera-msg">Camera access is needed for this feature. Allow it in your browser settings, or enter details manually.</div>
          <div class="sp-viewfinder"><span class="sp-corner tl"></span><span class="sp-corner tr"></span><span class="sp-corner bl"></span><span class="sp-corner br"></span></div>
          <div class="sp-cam-controls">
            <button class="sp-torch-btn">Torch on</button>
            <button class="sp-scan-btn"></button>
            <span style="width:70px"></span>
          </div>
        </div>`;
    }
    return `
      <div class="sp-header"><div class="sp-back">\u2039</div><div class="sp-title">${cfg.title}</div></div>
      ${tabs}
      <div class="sp-body">
        ${cfg.loading
          ? `<div class="sp-spinner-wrap"><div class="sp-dot"></div><div class="sp-dot"></div><div class="sp-dot"></div></div><div class="sp-empty" style="display:none">${cfg.empty || ''}</div>`
          : `<div class="sp-empty">${cfg.empty || ''}</div>`}
      </div>`;
  }

  function showSubpage(id) {
    const sp = document.querySelector(`.subpage[data-id="${id}"]`);
    if (!sp) return;
    sp.classList.add('open');
    document.body.style.overflow = 'hidden';
    const cfg = SUBPAGES[id];
    if (cfg.loading) {
      const spinnerWrap = sp.querySelector('.sp-spinner-wrap');
      const empty = sp.querySelector('.sp-empty');
      if (spinnerWrap) setTimeout(() => { spinnerWrap.style.display = 'none'; if (empty) empty.style.display = 'block'; }, 800);
    }
    if (cfg.type === 'camera') startCamera(sp);
  }

  function hideSubpage(id) {
    const sp = document.querySelector(`.subpage[data-id="${id}"]`);
    if (!sp) return;
    sp.classList.remove('open');
    document.body.style.overflow = '';
    stopCamera(sp);
  }

  async function startCamera(sp) {
    const video = sp.querySelector('video');
    const msg = sp.querySelector('.sp-camera-msg');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      sp._stream = stream;
      msg.style.display = 'none';
    } catch (err) {
      msg.style.display = 'flex';
    }
  }
  function stopCamera(sp) {
    if (sp._stream) { sp._stream.getTracks().forEach(t => t.stop()); sp._stream = null; }
  }
</script>
</body>
